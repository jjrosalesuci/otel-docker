services:

  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=CAMBIAR_ESTA_PASSWORD
      - GF_SERVER_DOMAIN=grafana.aseresoft.com
      - GF_SERVER_ROOT_URL=https://grafana.aseresoft.com
      - GF_SERVER_ENFORCE_DOMAIN=true

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.grafana.rule=Host(`grafana.aseresoft.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

    networks:
      - proxy
      - observability

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'

    networks:
      - observability

    restart: unless-stopped


  loki:
    image: grafana/loki:latest
    container_name: loki

    user: root

    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki

    command:
      - '-config.file=/etc/loki/local-config.yaml'

    networks:
      - observability

    restart: unless-stopped

  tempo-app:
    image: grafana/tempo:2.7.0
    container_name: tempo-app

    user: root

    volumes:
      - ./observability/tempo-config.yml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/lib/tempo

    command:
      - '-config.file=/etc/tempo/tempo-config.yaml'

    networks:
      - observability

    restart: unless-stopped


  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector

    volumes:
      - ./observability/otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro

    command:
      - '--config'
      - '/etc/otelcol-contrib/config.yaml'

    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

    networks:
      - observability

    depends_on:
      - prometheus
      - loki
      - tempo-app

    restart: unless-stopped


networks:

  proxy:
    external: true

  observability:
    driver: bridge


volumes:

  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data: